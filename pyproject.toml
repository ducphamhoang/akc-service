[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akc-service"
version = "0.1.0"
description = "Agent Knowledge Collective: learning, safety, and metrics engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4.0", "httpx>=0.27.0"]

[project.scripts]
akc-service = "akc_service.api.main:main"
akc-sync    = "akc_service.sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["akc_service*", "adapters*"]
